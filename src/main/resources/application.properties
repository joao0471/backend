spring.application.name=sensor-api

# Configuração para salvar o banco H2 em um arquivo na própria pasta do projeto (persistência)
spring.datasource.url=jdbc:h2:file:./data/sensoresdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mostra os comandos SQL no console
spring.jpa.show-sql=true

# Cria ou atualiza as tabelas automaticamente baseado na sua Entidade
spring.jpa.hibernate.ddl-auto=update

# Habilita o console do H2 no navegador
spring.h2.console.enabled=true